<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="85%">
      <stop offset="0" stop-color="#22306e"/>
      <stop offset="0.5" stop-color="#0e1640"/>
      <stop offset="1" stop-color="#060a1d"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#3a4790"/>
      <stop offset="1" stop-color="#141b44"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cf2ff"/><stop offset="1" stop-color="#1fb6e8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7a6ff"/><stop offset="1" stop-color="#7a4dff"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff9a3d"/></linearGradient>
    <linearGradient id="arc1" gradientUnits="userSpaceOnUse" x1="646" y1="117" x2="747" y2="291"><stop offset="0" stop-color="#4fd8ff"/><stop offset="1" stop-color="#9b7bff"/></linearGradient>
    <linearGradient id="arc2" gradientUnits="userSpaceOnUse" x1="700" y1="371" x2="500" y2="371"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <linearGradient id="arc3" gradientUnits="userSpaceOnUse" x1="453" y1="291" x2="554" y2="117"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#4fd8ff"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="head1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b7bff"/></marker>
    <marker id="head2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb347"/></marker>
    <marker id="head3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4fd8ff"/></marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8aa4ff" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="600" cy="260" r="230" fill="url(#halo)"/>
  <g fill="#c9d6ff">
    <circle cx="110" cy="80" r="1.6" opacity="0.7"/><circle cx="250" cy="190" r="1.1" opacity="0.5"/>
    <circle cx="1080" cy="96" r="1.8" opacity="0.8"/><circle cx="960" cy="230" r="1.2" opacity="0.5"/>
    <circle cx="180" cy="330" r="1.3" opacity="0.6"/><circle cx="1120" cy="350" r="1" opacity="0.5"/>
  </g>

  <!-- ring track -->
  <circle cx="600" cy="260" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="18"/>

  <!-- arcs: understand -> quality -> ship -> understand -->
  <g fill="none" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <path d="M646.4 117.3 A150 150 0 0 1 746.7 291.2" stroke="url(#arc1)" marker-end="url(#head1)"/>
    <path d="M700.4 371.5 A150 150 0 0 1 499.6 371.5" stroke="url(#arc2)" marker-end="url(#head2)"/>
    <path d="M453.3 291.2 A150 150 0 0 1 553.6 117.3" stroke="url(#arc3)" marker-end="url(#head3)"/>
  </g>

  <!-- core -->
  <g filter="url(#shadow)">
    <circle cx="600" cy="260" r="88" fill="url(#core)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  </g>
  <text x="600" y="258" text-anchor="middle" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-1">skills</text>
  <text x="600" y="288" text-anchor="middle" font-size="15" font-weight="500" fill="#aab8ea">10 agent skills</text>

  <!-- node: understand (top) -->
  <circle cx="600" cy="110" r="40" fill="#4fd8ff" opacity="0.18" filter="url(#glow)"/>
  <g filter="url(#shadow)"><circle cx="600" cy="110" r="32" fill="url(#cyan)"/></g>
  <g fill="none" stroke="#06263a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M582 110c5-9 11-13 18-13s13 4 18 13c-5 9-11 13-18 13s-13-4-18-13z"/>
    <circle cx="600" cy="110" r="5.5" fill="#06263a"/>
  </g>
  <text x="600" y="54" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="3" fill="#7cf2ff">UNDERSTAND</text>

  <!-- node: quality (lower right) -->
  <circle cx="729.9" cy="335" r="40" fill="#9b7bff" opacity="0.2" filter="url(#glow)"/>
  <g filter="url(#shadow)"><circle cx="729.9" cy="335" r="32" fill="url(#violet)"/></g>
  <g fill="#1e0b4d">
    <path d="M729.9 316l4.2 10.8 10.8 4.2-10.8 4.2-4.2 10.8-4.2-10.8-10.8-4.2 10.8-4.2z"/>
    <path d="M742 343l1.8 4.4 4.4 1.8-4.4 1.8-1.8 4.4-1.8-4.4-4.4-1.8 4.4-1.8z"/>
  </g>
  <text x="780" y="330" font-size="19" font-weight="800" letter-spacing="3" fill="#c7a6ff">IMPROVE</text>
  <text x="780" y="354" font-size="15" fill="#aab8ea">code quality</text>

  <!-- node: ship (lower left) -->
  <circle cx="470.1" cy="335" r="40" fill="#ffb347" opacity="0.2" filter="url(#glow)"/>
  <g filter="url(#shadow)"><circle cx="470.1" cy="335" r="32" fill="url(#amber)"/></g>
  <g fill="none" stroke="#4a2300" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="461" cy="322" r="4.5"/>
    <circle cx="461" cy="349" r="4.5"/>
    <circle cx="480" cy="331" r="4.5"/>
    <path d="M461 326.5v18M480 335.5c0 7-9 7-15 9.5"/>
  </g>
  <text x="420" y="330" text-anchor="end" font-size="19" font-weight="800" letter-spacing="3" fill="#ffd08a">SHIP</text>
  <text x="420" y="354" text-anchor="end" font-size="15" fill="#aab8ea">finish &amp; merge</text>

  <!-- cards -->
  <g filter="url(#shadow)">
    <rect x="60" y="446" width="340" height="196" rx="18" fill="#121a42"/>
    <rect x="430" y="446" width="340" height="196" rx="18" fill="#121a42"/>
    <rect x="800" y="446" width="340" height="196" rx="18" fill="#121a42"/>
  </g>
  <g>
    <rect x="60" y="446" width="340" height="196" rx="18" fill="url(#card)" stroke="#4fd8ff" stroke-opacity="0.45"/>
    <rect x="430" y="446" width="340" height="196" rx="18" fill="url(#card)" stroke="#9b7bff" stroke-opacity="0.5"/>
    <rect x="800" y="446" width="340" height="196" rx="18" fill="url(#card)" stroke="#ffb347" stroke-opacity="0.5"/>
    <rect x="60" y="446" width="340" height="5" rx="2.5" fill="url(#cyan)"/>
    <rect x="430" y="446" width="340" height="5" rx="2.5" fill="url(#violet)"/>
    <rect x="800" y="446" width="340" height="5" rx="2.5" fill="url(#amber)"/>
  </g>

  <!-- card: understand -->
  <text x="84" y="494" font-size="25" font-weight="800" fill="#ffffff">Understand the code</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="84" y="518" width="210" height="30" rx="8" fill="#4fd8ff" fill-opacity="0.12"/>
    <text x="96" y="538" fill="#7cf2ff">/explain-with-video</text>
    <rect x="84" y="556" width="219" height="30" rx="8" fill="#4fd8ff" fill-opacity="0.12"/>
    <text x="96" y="576" fill="#7cf2ff">/explain-with-slides</text>
    <rect x="84" y="594" width="138" height="30" rx="8" fill="#4fd8ff" fill-opacity="0.12"/>
    <text x="96" y="614" fill="#7cf2ff">/eval-report</text>
  </g>

  <!-- card: quality -->
  <text x="454" y="494" font-size="25" font-weight="800" fill="#ffffff">Improve code quality</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <rect x="454" y="518" width="148" height="30" rx="8" fill="#9b7bff" fill-opacity="0.16"/>
    <text x="464" y="538" fill="#d3bcff">/refactor-tests</text>
    <rect x="610" y="518" width="148" height="30" rx="8" fill="#9b7bff" fill-opacity="0.16"/>
    <text x="620" y="538" fill="#d3bcff">/refactor-evals</text>
    <rect x="454" y="556" width="204" height="30" rx="8" fill="#9b7bff" fill-opacity="0.16"/>
    <text x="464" y="576" fill="#d3bcff">/self-documented-code</text>
    <rect x="454" y="594" width="204" height="30" rx="8" fill="#9b7bff" fill-opacity="0.16"/>
    <text x="464" y="614" fill="#d3bcff">/dont-repeat-yourself</text>
  </g>

  <!-- card: ship -->
  <text x="824" y="494" font-size="25" font-weight="800" fill="#ffffff">Finish and merge</text>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="824" y="518" width="120" height="30" rx="8" fill="#ffb347" fill-opacity="0.14"/>
    <text x="836" y="538" fill="#ffd08a">/finish-pr</text>
    <rect x="824" y="556" width="147" height="30" rx="8" fill="#ffb347" fill-opacity="0.14"/>
    <text x="836" y="576" fill="#ffd08a">/baby-sitting</text>
  </g>
  <text x="824" y="614" font-size="13" fill="#9fb0e6">Claude Code · Codex · Cursor</text>
</svg>
