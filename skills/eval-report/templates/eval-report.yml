# Runs the evals when the files they cover change, and links an HTML report
# from the pull request. The report is built by a script: no model tokens.
name: evals

on:
  pull_request:
    paths:
      - 'evals/**'          # the eval files
      - 'src/prompts/**'    # and what they test: prompts, tools, the agent loop
      - '.eval-report.json'
      - '.github/eval-report/**'
      - '.github/workflows/evals.yml'

permissions:
  contents: read
  pull-requests: write   # the summary block and the comment

concurrency:
  group: evals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the merge base, for new or changed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Set up the project here (install dependencies, as the other workflows do).
      - name: Run the evals into a report
        env: {}   # the eval command's secrets, such as a model API key
        run: node .github/eval-report/eval-report.mjs run --scope pr
      # One self-contained HTML file, uploaded unzipped: GitHub opens it in the
      # browser, for people who can read the repository. Private repos stay private.
      - name: Upload the report
        id: report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: eval-report/eval-report.html
          archive: false
          retention-days: 30
      - name: Link the report from the PR
        if: always() && steps.report.outputs.artifact-url && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/eval-report/eval-report.mjs publish --url "${{ steps.report.outputs.artifact-url }}"
