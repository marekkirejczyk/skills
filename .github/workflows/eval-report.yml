# eval-report's own CI: tests the script, runs the fixture evals with a fake
# model, then reports on them and links the report on the PR, the same way an
# installed repo does. No model calls.
name: eval-report
on:
  pull_request:
    paths: ['skills/eval-report/**', '.github/workflows/eval-report.yml']
  push:
    branches: [main]
    paths: ['skills/eval-report/**', '.github/workflows/eval-report.yml']
permissions:
  contents: write        # push the report to gh-pages
  pull-requests: write   # comment, and the block at the top of the description
concurrency:
  group: eval-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base branch, to find new and changed cases
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test 'skills/eval-report/tests/*.test.mjs'
      - name: Run the fixture evals (fake model, no model calls)
        run: node skills/eval-report/fixtures/runner/run.mjs --out eval-results.json
      - name: Report
        run: bash skills/eval-report/scripts/ci.sh eval-results.json
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report/
