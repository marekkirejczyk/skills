# Tests the pull request skills' scripts: which event baby-sitting's watcher
# reports for a set of pull request states, and which changed files finish-pr
# gives a code owner. The tests need only bash, jq and git, and call nothing
# on GitHub.
name: baby-sitting

on:
  pull_request:
    paths:
      - 'skills/baby-sitting/**'
      - 'skills/finish-pr/**'
      - 'test/baby-sitting/**'
      - 'test/finish-pr/**'
      - '.github/workflows/baby-sitting.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test the watcher
        run: test/baby-sitting/watch.test.sh
      - name: Test code-owner matching
        run: test/finish-pr/owners.test.sh
